name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (MatePad & Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x android/botwrecompandroid/gradlew

      - name: Build Release APK
        working-directory: android/botwrecompandroid
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Stage APK
        id: stage_apk
        run: |
          APK_PATH=$(find android/botwrecompandroid/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          cp "$APK_PATH" BOTWRecompAndroid-MatePad-Universal.apk
          echo "apk_path=BOTWRecompAndroid-MatePad-Universal.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTWRecompAndroid-MatePad-Universal
          path: BOTWRecompAndroid-MatePad-Universal.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BOTWRecompAndroid-MatePad-Universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
