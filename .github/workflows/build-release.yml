name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (MatePad & Universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK & CMake
        run: |
          echo "Installing CMake 3.30.4..."
          curl -fsSL -o cmake-3.30.4-linux-x86_64.tar.gz https://github.com/Kitware/CMake/releases/download/v3.30.4/cmake-3.30.4-linux-x86_64.tar.gz
          mkdir -p $ANDROID_HOME/cmake/3.30.4
          tar -xzf cmake-3.30.4-linux-x86_64.tar.gz -C $ANDROID_HOME/cmake/3.30.4 --strip-components=1
          echo "$ANDROID_HOME/cmake/3.30.4/bin" >> $GITHUB_PATH
          echo "CMAKE_DIR=$ANDROID_HOME/cmake/3.30.4/bin" >> $GITHUB_ENV

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Link NDK Version
        run: |
          # AGP expects ndkVersion '30.0.16248370' or matching NDK in $ANDROID_HOME/ndk/
          ACTUAL_NDK="${{ steps.setup-ndk.outputs.ndk-path }}"
          mkdir -p $ANDROID_HOME/ndk
          ln -sf "$ACTUAL_NDK" "$ANDROID_HOME/ndk/30.0.16248370"
          echo "NDK symlinked to 30.0.16248370"

      - name: Download Prebuilt Dependencies & Fonts
        run: |
          mkdir -p android/deps/out/fonts android/deps/out/include android/deps/out/lib android/deps/out/volk
          
          # 1. DejaVu Font
          curl -fsSL -o dejavu.tar.bz2 https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          tar -xjf dejavu.tar.bz2
          cp dejavu-fonts-ttf-2.37/ttf/DejaVuSans.ttf android/deps/out/fonts/
          
          # 2. Vulkan Headers & Volk
          curl -fsSL -o vulkan-headers.tar.gz https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.350.1.tar.gz
          tar -xzf vulkan-headers.tar.gz
          cp -r Vulkan-Headers-vulkan-sdk-1.4.350.1/include/vulkan Vulkan-Headers-vulkan-sdk-1.4.350.1/include/vk_video android/deps/out/include/
          
          curl -fsSL -o vma.tar.gz https://github.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/archive/refs/tags/v3.3.0.tar.gz
          tar -xzf vma.tar.gz
          mkdir -p android/deps/out/include/vma
          cp VulkanMemoryAllocator-3.3.0/include/vk_mem_alloc.h android/deps/out/include/vma/
          
          curl -fsSL -o volk.tar.gz https://github.com/zeux/volk/archive/refs/tags/vulkan-sdk-1.4.350.1.tar.gz
          tar -xzf volk.tar.gz
          cp volk-vulkan-sdk-1.4.350.1/volk.h volk-vulkan-sdk-1.4.350.1/volk.c android/deps/out/volk/
          
          # 3. Extract prebuilt native libraries from official release
          curl -fsSL -o upstream.apk https://github.com/mamcjr/BOTWRecompAndroid/releases/download/v0.2.2-beta/BOTWRecompAndroid-0.2.2-beta.apk
          unzip -q upstream.apk -d upstream_unpacked
          if [ -d "upstream_unpacked/lib/arm64-v8a" ]; then
            cp upstream_unpacked/lib/arm64-v8a/*.so android/deps/out/lib/ || true
          fi
          if [ -d "upstream_unpacked/assets/gen" ]; then
            mkdir -p android/deps/out/gen
            cp -r upstream_unpacked/assets/gen/* android/deps/out/gen/ || true
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x android/botwrecompandroid/gradlew

      - name: Build Release APK
        working-directory: android/botwrecompandroid
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and Stage APK
        id: stage_apk
        run: |
          APK_PATH=$(find android/botwrecompandroid/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          cp "$APK_PATH" BOTWRecompAndroid-MatePad-Universal.apk
          echo "apk_path=BOTWRecompAndroid-MatePad-Universal.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOTWRecompAndroid-MatePad-Universal
          path: BOTWRecompAndroid-MatePad-Universal.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BOTWRecompAndroid-MatePad-Universal.apk
          generate_release_notes: true
          draft: false
          prerelease: false
